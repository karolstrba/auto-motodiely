name: Build AMDPRO feed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - generator.py
      - tests/**
      - .github/workflows/build-feed.yml
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build feed
        env:
          SOURCE_FEED_URL: ${{ secrets.SOURCE_FEED_URL }}
        run: python generator.py --limit 44000
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
