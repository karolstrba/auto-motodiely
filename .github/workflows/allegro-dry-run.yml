name: Allegro read-only audit

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply a live sample update"
        required: true
        type: boolean
        default: false
      create_draft:
        description: "Create exactly one inactive draft for a missing feed product"
        required: true
        type: boolean
        default: false
      activate_offer:
        description: "Activate exact verified draft offer ID"
        required: false
        type: string
      limit:
        description: "Maximum live offers (1-10)"
        required: true
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "10"
        default: "1"
      confirmation:
        description: "Use the exact confirmation required by the selected write mode"
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build current preview
        env:
          SOURCE_FEED_URL: ${{ secrets.SOURCE_FEED_URL }}
        run: python generator.py --limit 44000 --allegro-markup 10
      - name: Audit Allegro offers without changes
        env:
          ALLEGRO_CLIENT_ID: ${{ secrets.ALLEGRO_CLIENT_ID }}
          ALLEGRO_CLIENT_SECRET: ${{ secrets.ALLEGRO_CLIENT_SECRET }}
          ALLEGRO_REFRESH_TOKEN: ${{ secrets.ALLEGRO_REFRESH_TOKEN }}
        run: >-
          python allegro_sync.py
          --limit "${{ inputs.limit }}"
          ${{ inputs.apply && '--apply' || '' }}
          ${{ inputs.create_draft && '--create-draft' || '' }}
          ${{ inputs.activate_offer && format('--activate-offer {0}', inputs.activate_offer) || '' }}
          --confirm "${{ inputs.confirmation }}"
